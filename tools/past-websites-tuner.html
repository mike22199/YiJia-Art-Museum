<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>歷屆網站 · 版面調整工具</title>
  <link rel="stylesheet" href="../app/styles.css" />
  <style>
    :root{
      --ui-scale: 1;
      --inner-font: "DIN Pro Condensed", "FIFI CJK Serif", "Noto Serif TC", "Microsoft JhengHei", sans-serif;
      --inner-accent: #8f1f1f;
    }
    *{ box-sizing: border-box; }
    body{
      margin: 0;
      min-height: 100vh;
      background: #1c1c1c;
      color: #eee;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }
    .tunerApp{
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: 100vh;
    }
    .tunerPanel{
      background: #111;
      border-right: 1px solid #333;
      padding: 16px;
      overflow: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    .tunerPanel h1{
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .tunerHint{
      margin: 0 0 16px;
      font-size: 12px;
      line-height: 1.55;
      color: #aaa;
    }
    .tunerHint code{
      color: #f0c674;
      font-size: 11px;
    }
    .tunerSection{
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2a2a2a;
    }
    .tunerSection h2{
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: #f2b7b7;
      text-transform: uppercase;
    }
    .tunerRow{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .tunerRow label{
      font-size: 12px;
      color: #ccc;
    }
    .tunerRow output{
      font-size: 11px;
      color: #8fd3ff;
      min-width: 52px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .tunerRow input[type="range"]{
      grid-column: 1 / -1;
      width: 100%;
    }
    .tunerSelect,
    .tunerActions button,
    .tunerCss{
      width: 100%;
      font: inherit;
    }
    .tunerSelect{
      margin-bottom: 10px;
      padding: 8px 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1a1a1a;
      color: #fff;
    }
    .tunerActions{
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }
    .tunerActions button{
      padding: 10px 12px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    .tunerActions button.primary{
      background: #b82020;
      border-color: #b82020;
      font-weight: 700;
    }
    .tunerActions button:hover{ filter: brightness(1.08); }
    .tunerCss{
      min-height: 180px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #0b0b0b;
      color: #d6ffd6;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.45;
      resize: vertical;
    }
    .tunerStatus{
      margin-top: 8px;
      min-height: 1.2em;
      font-size: 12px;
      color: #8fd3ff;
    }
    .tunerPreviewWrap{
      overflow: auto;
      max-height: 100vh;
      background: #fff;
      color: #111;
    }
    .tunerPreviewInner{
      padding: 40px 24px 80px;
    }
    .archivePastWebsitesTitle{
      margin: 0 0 28px;
      text-align: center;
      font-family: var(--inner-font);
      font-size: 37.33px;
      font-weight: 900;
      color: #111;
    }
    .tunerSelected{
      outline: 2px dashed #b82020;
      outline-offset: 6px;
    }
    @media (max-width: 960px){
      .tunerApp{ grid-template-columns: 1fr; }
      .tunerPanel{
        position: static;
        max-height: none;
        border-right: none;
        border-bottom: 1px solid #333;
      }
      .tunerPreviewWrap{ max-height: none; }
    }
  </style>
</head>
<body>
  <div class="tunerApp">
    <aside class="tunerPanel">
      <h1>歷屆網站調整工具</h1>
      <p class="tunerHint">
        右側即時預覽。調完後按「產生並複製 CSS」，把內容貼給我即可套回
        <code>app/styles.css</code>。
      </p>

      <div class="tunerSection">
        <h2>整體</h2>
        <div class="tunerRow" data-global="spine"><label>紅軸寬度</label><output></output><input type="range" min="72" max="220" step="2" value="168" /></div>
        <div class="tunerRow" data-global="gap"><label>年份垂直間距</label><output></output><input type="range" min="8" max="80" step="1" value="11" /></div>
        <div class="tunerRow" data-global="colGap"><label>左右與紅軸間距</label><output></output><input type="range" min="4" max="60" step="1" value="20" /></div>
        <div class="tunerRow" data-global="artW"><label>圖片最大寬</label><output></output><input type="range" min="80" max="360" step="2" value="264" /></div>
        <div class="tunerRow" data-global="artH"><label>圖片最大高</label><output></output><input type="range" min="80" max="360" step="2" value="216" /></div>
        <div class="tunerRow" data-global="titleMax"><label>標題區塊最大寬</label><output></output><input type="range" min="120" max="420" step="2" value="284" /></div>
        <div class="tunerRow" data-global="titleZh"><label>主標字級</label><output></output><input type="range" min="12" max="40" step="1" value="26" /></div>
        <div class="tunerRow" data-global="titleSub"><label>副標字級</label><output></output><input type="range" min="10" max="32" step="1" value="16" /></div>
        <div class="tunerRow" data-global="titleEn"><label>英文副標字級</label><output></output><input type="range" min="10" max="28" step="1" value="15" /></div>
        <div class="tunerRow" data-global="yearSize"><label>紅軸年份字級</label><output></output><input type="range" min="18" max="96" step="1" value="86" /></div>
        <div class="tunerRow" data-global="yearRange"><label>「- 2026」字級</label><output></output><input type="range" min="10" max="48" step="1" value="36" /></div>
        <div class="tunerRow" data-global="yearPad"><label>紅軸年份邊距</label><output></output><input type="range" min="0" max="40" step="1" value="4" /></div>
        <div class="tunerRow" data-global="markerSize"><label>空年份字級</label><output></output><input type="range" min="10" max="36" step="1" value="16" /></div>
      </div>

      <div class="tunerSection">
        <h2>單一年份微調</h2>
        <select id="yearSelect" class="tunerSelect"></select>
        <div class="tunerRow" data-year-ctrl="artScale"><label>圖片縮放</label><output></output><input type="range" min="40" max="220" step="1" value="100" /></div>
        <div class="tunerRow" data-year-ctrl="artX"><label>圖片 X</label><output></output><input type="range" min="-120" max="120" step="1" value="0" /></div>
        <div class="tunerRow" data-year-ctrl="artY"><label>圖片 Y</label><output></output><input type="range" min="-120" max="120" step="1" value="0" /></div>
        <div class="tunerRow" data-year-ctrl="titleScale"><label>標題縮放</label><output></output><input type="range" min="40" max="220" step="1" value="100" /></div>
        <div class="tunerRow" data-year-ctrl="titleX"><label>標題 X</label><output></output><input type="range" min="-120" max="120" step="1" value="0" /></div>
        <div class="tunerRow" data-year-ctrl="titleY"><label>標題 Y</label><output></output><input type="range" min="-120" max="120" step="1" value="0" /></div>
      </div>

      <div class="tunerSection">
        <h2>匯出</h2>
        <div class="tunerActions">
          <button type="button" class="primary" id="btnExport">產生並複製 CSS</button>
          <button type="button" id="btnResetYear">重設目前年份</button>
          <button type="button" id="btnResetAll">全部重設</button>
        </div>
        <textarea id="cssOut" class="tunerCss" readonly placeholder="匯出的 CSS 會出現在這裡…"></textarea>
        <div class="tunerStatus" id="status"></div>
      </div>
    </aside>

    <main class="tunerPreviewWrap">
      <div class="tunerPreviewInner">
        <h1 class="archivePastWebsitesTitle">歷屆網站</h1>
        <div id="preview" class="archivePastWebsitesPage"></div>
      </div>
    </main>
  </div>

  <script>
    const GLOBAL_DEFAULTS = {
      spine: 168,
      gap: 11,
      colGap: 20,
      artW: 264,
      artH: 216,
      titleMax: 284,
      titleZh: 26,
      titleSub: 16,
      titleEn: 15,
      yearSize: 86,
      yearRange: 36,
      yearPad: 4,
      markerSize: 16,
    };

    const YEAR_DEFAULT = {
      artScale: 100,
      artX: 0,
      artY: 0,
      titleScale: 100,
      titleX: 0,
      titleY: 0,
    };

    const FEATURE_YEARS = [
      "2027-2026",
      "2023",
      "2022",
      "2021",
      "2020",
      "2019",
      "2018",
      "2016",
    ];

    const state = {
      global: { ...GLOBAL_DEFAULTS },
      years: Object.fromEntries(FEATURE_YEARS.map((y) => [y, { ...YEAR_DEFAULT }])),
      selectedYear: FEATURE_YEARS[0],
    };

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k.startsWith("on") && typeof v === "function")
          node.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v !== undefined && v !== null) node.setAttribute(k, String(v));
      }
      for (const c of children || []) {
        if (c == null) continue;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
      return node;
    }

    function parseYearParts(yearLabel) {
      const raw = String(yearLabel || "").trim();
      const rangeMatch = raw.match(/^(\d{4})\s*[-–]\s*(\d{4})$/);
      if (rangeMatch) {
        return {
          type: "range",
          century: rangeMatch[1].slice(0, 2),
          yearShort: rangeMatch[1].slice(2),
          rangeSuffix: `- ${rangeMatch[2]}`,
        };
      }
      if (/^\d{4}$/.test(raw)) {
        return { type: "single", century: raw.slice(0, 2), yearShort: raw.slice(2) };
      }
      return { type: "plain", label: raw };
    }

    function yearStack(label) {
      const parts = parseYearParts(label);
      if (parts.type === "plain") {
        return el("div", { class: "pastWebsitesYearStack" }, [
          el("span", { class: "pastWebsitesYearLine", text: parts.label }),
        ]);
      }
      const kids = [
        el("span", { class: "pastWebsitesYearLine pastWebsitesYearLine--century", text: parts.century }),
        el("span", { class: "pastWebsitesYearLine pastWebsitesYearLine--short", text: parts.yearShort }),
      ];
      if (parts.rangeSuffix) {
        kids.push(el("span", { class: "pastWebsitesYearLine pastWebsitesYearLine--range", text: parts.rangeSuffix }));
      }
      return el("div", { class: "pastWebsitesYearStack" }, kids);
    }

    function titleBlock(cfg) {
      if (!cfg.title && !cfg.subtitle && !cfg.subtitleEn) return null;
      return el("div", { class: "pastWebsitesTitleBlock" }, [
        cfg.title ? el("p", { class: "pastWebsitesTitleZh", text: cfg.title }) : null,
        cfg.subtitle ? el("p", { class: "pastWebsitesTitleSub", text: cfg.subtitle }) : null,
        cfg.subtitleEn ? el("p", { class: "pastWebsitesTitleEn", text: cfg.subtitleEn }) : null,
      ]);
    }

    function artBlock(cfg, year) {
      const src = cfg.banner?.src || cfg.image?.src;
      if (!src) return null;
      const img = el("img", {
        class: "pastWebsitesArtImg",
        src: src.startsWith("./") ? `../${src.slice(2)}` : src,
        alt: cfg.banner?.alt || cfg.image?.alt || year,
      });
      return el("div", { class: "pastWebsitesArt" }, [img]);
    }

    function buildEntries(past) {
      const timeline = Array.isArray(past.timeline) ? past.timeline : FEATURE_YEARS;
      const byYear = past.byYear || {};
      let featureIndex = 0;
      const root = el("div", { class: "pastWebsitesTimeline", id: "timelineRoot" });
      root.appendChild(el("div", { class: "pastWebsitesSpine", "aria-hidden": "true" }));

      for (const key of timeline) {
        const cfg = byYear[key] || {};
        const yearLabel = cfg.yearLabel || key;
        const empty = cfg.empty === true;
        const markerOnly = cfg.markerOnly === true || empty;
        const hasImage = Boolean(cfg.banner?.src || cfg.image?.src);
        const hasCopy = Boolean(cfg.title || cfg.subtitle || cfg.subtitleEn);
        const hasFeature = !empty && !markerOnly && (hasImage || hasCopy || cfg.modal);

        if (!hasFeature) {
          root.appendChild(
            el("div", { class: "pastWebsitesEntry pastWebsitesEntry--marker", "data-year": key }, [
              el("div", { class: "pastWebsitesSide pastWebsitesSide--left", "aria-hidden": "true" }),
              el("div", { class: "pastWebsitesYearCol pastWebsitesYearCol--marker" }, [
                el("span", { class: "pastWebsitesMarkerDash", "aria-hidden": "true" }),
              ]),
              el("div", { class: "pastWebsitesSide pastWebsitesSide--right pastWebsitesSide--markerLabel" }, [
                el("span", { class: "pastWebsitesMarkerYear", text: yearLabel }),
              ]),
            ])
          );
          continue;
        }

        const imageOnLeft = featureIndex % 2 === 0;
        featureIndex += 1;
        const yearAlign = imageOnLeft ? "right" : "left";
        const art = artBlock(cfg, key);
        const title = titleBlock(cfg);
        const left = imageOnLeft ? art : title;
        const right = imageOnLeft ? title : art;

        const entry = el(
          "div",
          {
            class: `pastWebsitesEntry pastWebsitesEntry--feature pastWebsitesEntry--${
              imageOnLeft ? "imageLeft" : "imageRight"
            }`,
            "data-year": key,
          },
          [
            el("div", { class: "pastWebsitesSide pastWebsitesSide--left" }, left ? [left] : []),
            el(
              "div",
              {
                class: `pastWebsitesYearCol pastWebsitesYearCol--align${
                  yearAlign === "left" ? "Left" : "Right"
                }`,
              },
              [
                (() => {
                  const stack = yearStack(yearLabel);
                  stack.classList.add(
                    yearAlign === "left" ? "pastWebsitesYearStack--alignLeft" : "pastWebsitesYearStack--alignRight"
                  );
                  return stack;
                })(),
              ]
            ),
            el("div", { class: "pastWebsitesSide pastWebsitesSide--right" }, right ? [right] : []),
          ]
        );
        entry.addEventListener("click", () => {
          state.selectedYear = key;
          yearSelect.value = key;
          loadYearControls();
          highlightSelected();
        });
        root.appendChild(entry);
      }
      return root;
    }

    function applyGlobal() {
      const root = document.getElementById("timelineRoot");
      if (!root) return;
      const g = state.global;
      root.style.setProperty("--past-spine-width", `${g.spine}px`);
      root.style.setProperty("--past-gap", `${g.gap}px`);
      root.style.setProperty("--past-col-gap", `${g.colGap}px`);
      root.style.setProperty("--past-art-max-w", `${g.artW}px`);
      root.style.setProperty("--past-art-max-h", `${g.artH}px`);
      root.style.setProperty("--past-title-max-w", `${g.titleMax}px`);
      root.style.setProperty("--past-title-zh", `${g.titleZh}px`);
      root.style.setProperty("--past-title-sub", `${g.titleSub}px`);
      root.style.setProperty("--past-title-en", `${g.titleEn}px`);
      root.style.setProperty("--past-year-size", `${g.yearSize}px`);
      root.style.setProperty("--past-year-range-size", `${g.yearRange}px`);
      root.style.setProperty("--past-year-pad", `${g.yearPad}px`);
      root.style.setProperty("--past-marker-size", `${g.markerSize}px`);
    }

    function applyYear(year) {
      const entry = document.querySelector(`.pastWebsitesEntry[data-year="${CSS.escape(year)}"]`);
      if (!entry) return;
      const y = state.years[year] || YEAR_DEFAULT;
      entry.style.setProperty("--pw-art-scale", String(y.artScale / 100));
      entry.style.setProperty("--pw-art-x", `${y.artX}px`);
      entry.style.setProperty("--pw-art-y", `${y.artY}px`);
      entry.style.setProperty("--pw-title-scale", String(y.titleScale / 100));
      entry.style.setProperty("--pw-title-x", `${y.titleX}px`);
      entry.style.setProperty("--pw-title-y", `${y.titleY}px`);
    }

    function applyAllYears() {
      FEATURE_YEARS.forEach(applyYear);
    }

    function highlightSelected() {
      document.querySelectorAll(".pastWebsitesEntry").forEach((node) => {
        node.classList.toggle("tunerSelected", node.getAttribute("data-year") === state.selectedYear);
      });
    }

    function syncOutputs() {
      document.querySelectorAll(".tunerRow[data-global]").forEach((row) => {
        const key = row.getAttribute("data-global");
        const input = row.querySelector("input");
        const output = row.querySelector("output");
        input.value = state.global[key];
        output.textContent = `${state.global[key]}px`;
      });
      loadYearControls();
    }

    function loadYearControls() {
      const y = state.years[state.selectedYear] || YEAR_DEFAULT;
      document.querySelectorAll(".tunerRow[data-year-ctrl]").forEach((row) => {
        const key = row.getAttribute("data-year-ctrl");
        const input = row.querySelector("input");
        const output = row.querySelector("output");
        input.value = y[key];
        if (key === "artScale" || key === "titleScale") output.textContent = `${y[key]}%`;
        else output.textContent = `${y[key]}px`;
      });
      highlightSelected();
    }

    function buildCss() {
      const g = state.global;
      const lines = [];
      lines.push("/* 歷屆網站 tuner 匯出 — 貼到 app/styles.css 的 .pastWebsitesTimeline 區塊 */");
      lines.push(".pastWebsitesTimeline{");
      lines.push(`  --past-spine-width: ${g.spine}px;`);
      lines.push(`  --past-gap: ${g.gap}px;`);
      lines.push(`  --past-col-gap: ${g.colGap}px;`);
      lines.push(`  --past-art-max-w: ${g.artW}px;`);
      lines.push(`  --past-art-max-h: ${g.artH}px;`);
      lines.push(`  --past-title-max-w: ${g.titleMax}px;`);
      lines.push(`  --past-title-zh: ${g.titleZh}px;`);
      lines.push(`  --past-title-sub: ${g.titleSub}px;`);
      lines.push(`  --past-title-en: ${g.titleEn}px;`);
      lines.push(`  --past-year-size: ${g.yearSize}px;`);
      lines.push(`  --past-year-range-size: ${g.yearRange}px;`);
      lines.push(`  --past-year-pad: ${g.yearPad}px;`);
      lines.push(`  --past-marker-size: ${g.markerSize}px;`);
      lines.push("}");
      lines.push("");

      for (const year of FEATURE_YEARS) {
        const y = state.years[year];
        const changed =
          y.artScale !== 100 ||
          y.artX !== 0 ||
          y.artY !== 0 ||
          y.titleScale !== 100 ||
          y.titleX !== 0 ||
          y.titleY !== 0;
        if (!changed) continue;
        lines.push(`.pastWebsitesEntry[data-year="${year}"]{`);
        if (y.artScale !== 100) lines.push(`  --pw-art-scale: ${(y.artScale / 100).toFixed(2)};`);
        if (y.artX !== 0) lines.push(`  --pw-art-x: ${y.artX}px;`);
        if (y.artY !== 0) lines.push(`  --pw-art-y: ${y.artY}px;`);
        if (y.titleScale !== 100) lines.push(`  --pw-title-scale: ${(y.titleScale / 100).toFixed(2)};`);
        if (y.titleX !== 0) lines.push(`  --pw-title-x: ${y.titleX}px;`);
        if (y.titleY !== 0) lines.push(`  --pw-title-y: ${y.titleY}px;`);
        lines.push("}");
        lines.push("");
      }
      return lines.join("\n").trim() + "\n";
    }

    const yearSelect = document.getElementById("yearSelect");
    const cssOut = document.getElementById("cssOut");
    const status = document.getElementById("status");

    FEATURE_YEARS.forEach((y) => {
      yearSelect.appendChild(el("option", { value: y, text: y }));
    });

    document.querySelectorAll(".tunerRow[data-global]").forEach((row) => {
      const key = row.getAttribute("data-global");
      const input = row.querySelector("input");
      input.addEventListener("input", () => {
        state.global[key] = Number(input.value);
        row.querySelector("output").textContent = `${state.global[key]}px`;
        applyGlobal();
      });
    });

    document.querySelectorAll(".tunerRow[data-year-ctrl]").forEach((row) => {
      const key = row.getAttribute("data-year-ctrl");
      const input = row.querySelector("input");
      input.addEventListener("input", () => {
        const y = state.years[state.selectedYear];
        y[key] = Number(input.value);
        if (key === "artScale" || key === "titleScale") {
          row.querySelector("output").textContent = `${y[key]}%`;
        } else {
          row.querySelector("output").textContent = `${y[key]}px`;
        }
        applyYear(state.selectedYear);
      });
    });

    yearSelect.addEventListener("change", () => {
      state.selectedYear = yearSelect.value;
      loadYearControls();
    });

    document.getElementById("btnExport").addEventListener("click", async () => {
      const css = buildCss();
      cssOut.value = css;
      try {
        await navigator.clipboard.writeText(css);
        status.textContent = "已複製到剪貼簿，可直接貼給我。";
      } catch (_) {
        status.textContent = "已產生 CSS（若無法自動複製，請手動全選複製）。";
        cssOut.focus();
        cssOut.select();
      }
    });

    document.getElementById("btnResetYear").addEventListener("click", () => {
      state.years[state.selectedYear] = { ...YEAR_DEFAULT };
      loadYearControls();
      applyYear(state.selectedYear);
      status.textContent = `已重設 ${state.selectedYear}`;
    });

    document.getElementById("btnResetAll").addEventListener("click", () => {
      state.global = { ...GLOBAL_DEFAULTS };
      state.years = Object.fromEntries(FEATURE_YEARS.map((y) => [y, { ...YEAR_DEFAULT }]));
      syncOutputs();
      applyGlobal();
      applyAllYears();
      status.textContent = "已全部重設";
    });

    async function boot() {
      const res = await fetch("../content/site-content.json", { cache: "no-store" });
      const data = await res.json();
      const past = data.archive?.pastExhibitions || {};
      const preview = document.getElementById("preview");
      preview.innerHTML = "";
      preview.appendChild(buildEntries(past));
      syncOutputs();
      applyGlobal();
      applyAllYears();
      highlightSelected();
    }

    boot().catch((err) => {
      status.textContent = `載入失敗：${err.message}`;
    });
  </script>
</body>
</html>
